<footer class="site-footer h-card">
  <data class="u-url" href="{{ "/" | relative_url }}"></data>

  <div class="wrapper">

    <h2 class="footer-heading">{{ site.title | escape }}</h2>

    <div class="footer-col-wrapper">
      <div class="footer-col footer-col-1">
        <ul class="contact-list">
          <li class="p-name">
            {%- if site.author -%}
              {{ site.author | escape }}
            {%- else -%}
              {{ site.title | escape }}
            {%- endif -%}
            </li>
            {%- if site.email -%}
            <li><a class="u-email" href="mailto:{{ site.email }}">{{ site.email }}</a></li>
            {%- endif -%}
        </ul>
      </div>

      <div class="footer-col footer-col-2">
        {%- include social.html -%}
      </div>

      <div class="footer-col footer-col-3">
        <p style="margin-bottom: 3px;">{{ site.description | escape }}</p>
<!--        <a class="page-link" href="https://revolut.me/simon0ywj" target="_blank" rel="noopener noreferrer" style = "color:grey">-->
<!--          [ Donate ]-->
<!--        </a>-->
        <a id="donate_footer"></a>
        {% include download_button.html %}
        <script> createDonateButton("donate_footer", "https://revolut.me/simon0ywj", "grey"); </script>
      </div>
    </div>

  </div>

</footer>
