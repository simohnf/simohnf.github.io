<!-- Modal Popup HTML -->
<div id="dl-modal-overlay" style="display: none; position: fixed; top: 0; left: 0; width: 100%; height: 100%; background: rgba(0,0,0,0.6); z-index: 10000; align-items: center; justify-content: center;">
    <div style="background: #fff; padding: 25px; border-radius: 12px; max-width: 420px; width: 90%; text-align: center; font-family: sans-serif; box-shadow: 0 10px 25px rgba(0,0,0,0.2);">

        <!-- Dynamic Header Message -->
        <h3 id="modal-title" style="margin-top: 0; color: #222;">Get Your Download</h3>
        <p id="modal-subtext" style="font-size: 0.85em; color: #666; margin-bottom: 15px;">
            Enter your email to start the download.
        </p>

        <!-- Pure HTML Kit Form -->
        <form id="kit-gated-form" onsubmit="handleKitDownload(event)" style="display: flex; flex-direction: column; gap: 10px; margin-bottom: 15px;">
            <input
                    type="email"
                    id="kit-email-input"
                    name="email_address"
                    placeholder="your-email@example.com"
                    required
                    style="width: 100%; padding: 10px; border: 1px solid #ccc; border-radius: 6px; font-size: 0.9em; box-sizing: border-box;"
            >
            <button
                    type="submit"
                    id="kit-submit-btn"
                    style="width: 100%; padding: 11px; background: #0075FF; color: white; border: none; border-radius: 6px; font-weight: bold; cursor: pointer; font-size: 0.9em;"
            >
                Download Now
            </button>
        </form>

        <hr style="border: 0; border-top: 1px solid #eee; margin: 15px 0;">

        <!-- Support / Donation Callout -->
        <p style="font-size: 0.8em; color: #555; margin-bottom: 8px;">
            All plugins are free and open-source. Please consider supporting ongoing development!
        </p>
        <a
                href="https://simon-fay.kit.com/products/support"
                target="_blank"
                rel="noopener noreferrer"
                style="display: block; width: 100%; padding: 10px; background: #222; color: white; border-radius: 6px; text-decoration: none; font-size: 0.85em; font-weight: bold; box-sizing: border-box;"
        >
            ☕ Donate / Support
        </a>

        <div style="margin-top: 15px;">
            <button id="modal-close-btn" onclick="closeDownloadModal()" style="background: transparent; border: none; color: #888; font-size: 0.8em; cursor: pointer; text-decoration: underline;">
                Close
            </button>
        </div>
    </div>
</div>

<script>
    // Ensure global variable exists safely
    if (typeof activeDownloadUrl === 'undefined') {
        var activeDownloadUrl = "";
    }

    function openDownloadModal(downloadUrl) {
        activeDownloadUrl = downloadUrl;
        var modal = document.getElementById('dl-modal-overlay');

        var title = document.getElementById('modal-title');
        var subtext = document.getElementById('modal-subtext');
        var form = document.getElementById('kit-gated-form');
        var btn = document.getElementById('kit-submit-btn');
        var closeBtn = document.getElementById('modal-close-btn');

        if (title) {
            title.innerText = "Get Your Download";
            title.style.color = "#222";
        }
        if (subtext) {
            subtext.innerText = "Enter your email to start the download. \nYou can unsubscribe at any time.";
        }
        if (form) form.style.display = 'flex';
        if (btn) {
            btn.disabled = false;
            btn.innerText = "Download Now";
        }
        if (closeBtn) closeBtn.innerText = "Close";

        if (modal) modal.style.display = 'flex';
    }

    function closeDownloadModal() {
        var modal = document.getElementById('dl-modal-overlay');
        if (modal) modal.style.display = 'none';
    }

    async function handleKitDownload(event) {
        event.preventDefault();
        var email = document.getElementById('kit-email-input').value;
        var btn = document.getElementById('kit-submit-btn');

        if (btn) {
            btn.disabled = true;
            btn.innerText = "Starting Download...";
        }

        // 1. Post email directly to Kit
        try {
            var formData = new FormData();
            formData.append('email_address', email);

            await fetch("https://app.kit.com/forms/9984030/subscriptions", {
                method: "POST",
                body: formData,
                mode: "no-cors"
            });
        } catch (err) {
            console.warn("Kit logging failed, proceeding with download:", err);
        }

        // 2. Trigger file download in background
        if (activeDownloadUrl) {
            var hiddenLink = document.createElement('a');
            hiddenLink.href = activeDownloadUrl;
            hiddenLink.setAttribute('download', '');
            document.body.appendChild(hiddenLink);
            hiddenLink.click();
            document.body.removeChild(hiddenLink);
        }

        // 3. Keep modal open, hide form, and prompt for support/donation
        var title = document.getElementById('modal-title');
        var subtext = document.getElementById('modal-subtext');
        var form = document.getElementById('kit-gated-form');
        var closeBtn = document.getElementById('modal-close-btn');

        if (title) {
            title.innerText = "🎉 Your Download Has Started!";
            title.style.color = "#0075FF";
        }
        if (subtext) {
            subtext.innerHTML = 'If your download didn\'t start automatically, <a href="' + activeDownloadUrl + '" style="color: #0075FF; text-decoration: underline;">click here</a>.';
        }
        if (form) form.style.display = 'none';
        if (closeBtn) closeBtn.innerText = "Close / Continue";
    }

    function bindModalToLink(linkElement, targetUrl) {
        if (!linkElement || !targetUrl) return;
        linkElement.href = targetUrl;
        linkElement.onclick = function(e) {
            e.preventDefault();
            openDownloadModal(targetUrl);
        };
    }

    // --- Main Download Button Function ---
    async function createDownloadButton(owner, repo, containerId) {
        var container = document.getElementById(containerId);
        if (!container) return;

        container.innerHTML = `
    <div style="text-align: center; margin: 20px 0; font-family: sans-serif;">
      <a class="primary-download-btn" href="#" style="display: inline-block; padding: 12px 24px; background-color: #0075FF; color: white; border-radius: 8px; font-weight: bold; text-decoration: none; font-size: 1em;">
        Checking latest release...
      </a>
      <p class="os-detected-label" style="font-size: 0.85em; color: #666; margin-top: 6px;"></p>
      <div class="all-downloads" style="margin-top: 10px; display: none; font-size: 0.85em; color: #555;">
        <span>Other platforms: </span>
        <a class="mac-link" href="#" style="margin: 0 4px; display: none;">macOS</a>
        <a class="win-link" href="#" style="margin: 0 4px; display: none;">Windows</a>
        <a class="linux-link" href="#" style="margin: 0 4px; display: none;">Linux</a>
      </div>
    </div>
  `;

        var primaryBtn = container.querySelector('.primary-download-btn');
        var label = container.querySelector('.os-detected-label');
        var macLink = container.querySelector('.mac-link');
        var winLink = container.querySelector('.win-link');
        var linuxLink = container.querySelector('.linux-link');
        var allDownloads = container.querySelector('.all-downloads');

        function detectOS() {
            var userAgent = navigator.userAgent.toLowerCase();
            if (userAgent.includes("mac")) return "macos";
            if (userAgent.includes("win")) return "windows";
            if (userAgent.includes("linux")) return "ubuntu";
            return "unknown";
        }

        try {
            var response = await fetch(`https://api.github.com/repos/${owner}/${repo}/releases/latest`);

            if (!response.ok) {
                throw new Error(`HTTP ${response.status}`);
            }

            var release = await response.json();
            var assets = release.assets;

            var macAsset = assets.find(a => a.name.toLowerCase().includes('.pkg') || a.name.toLowerCase().includes('macos'));
            var winAsset = assets.find(a => a.name.toLowerCase().includes('windows') || a.name.toLowerCase().includes('.exe'));
            var linuxAsset = assets.find(a => a.name.toLowerCase().includes('ubuntu') || a.name.toLowerCase().includes('linux'));

            if (macAsset) {
                bindModalToLink(macLink, macAsset.browser_download_url);
                macLink.style.display = "inline";
            }
            if (winAsset) {
                bindModalToLink(winLink, winAsset.browser_download_url);
                winLink.style.display = "inline";
            }
            if (linuxAsset) {
                bindModalToLink(linuxLink, linuxAsset.browser_download_url);
                linuxLink.style.display = "inline";
            }

            allDownloads.style.display = 'block';

            var userOS = detectOS();

            if (userOS === "macos" && macAsset) {
                primaryBtn.innerText = `Download for macOS (${release.tag_name})`;
                label.innerText = `Detected macOS — ${macAsset.name}`;
                bindModalToLink(primaryBtn, macAsset.browser_download_url);
            } else if (userOS === "windows" && winAsset) {
                primaryBtn.innerText = `Download for Windows (${release.tag_name})`;
                label.innerText = `Detected Windows — ${winAsset.name}`;
                bindModalToLink(primaryBtn, winAsset.browser_download_url);
            } else if (userOS === "ubuntu" && linuxAsset) {
                primaryBtn.innerText = `Download for Linux (${release.tag_name})`;
                label.innerText = `Detected Linux — ${linuxAsset.name}`;
                bindModalToLink(primaryBtn, linuxAsset.browser_download_url);
            } else {
                primaryBtn.href = release.html_url;
                primaryBtn.innerText = `View Release (${release.tag_name})`;
                label.innerText = "Select your operating system below";
            }

        } catch (err) {
            console.error(`Failed to fetch downloads for ${owner}/${repo}:`, err);
            primaryBtn.href = `https://github.com/${owner}/${repo}/releases`;
            primaryBtn.innerText = "View Downloads on GitHub";
            label.innerText = "Unable to fetch direct downloads automatically";
        }
    }

    // --- Donate Button Functions ---
    function createDonateButton(containerId, url = "https://simon-fay.kit.com/products/support", colour="black") {

        const container = document.getElementById(containerId);
        if (!container) return;

        // 1. Inject the literal button element string template exactly how you want it
        container.innerHTML = `
        <button data-commerce id="donate-btn-dynamic" >
            Donate
        </button>
    `;

        // 2. Safely bind the URL and fire Kit's modal component script
        const btn = document.getElementById('donate-btn-dynamic');
        if (btn) {
            // Feed the URL straight into the element object
            btn.href = url;

            // Force Kit's script to load and catch this specific button string
            const script = document.createElement('script');
            script.src = 'https://simon-fay.kit.com/commerce.js';
            document.head.appendChild(script);
        }
    }
</script>
